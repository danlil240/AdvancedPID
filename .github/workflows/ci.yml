name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate sample data
        run: python examples/data/generate_samples.py

      - name: Run golden examples (headless)
        env:
          MPLBACKEND: Agg
        run: |
          python examples/01_quickstart_plant.py --output ./output
          python examples/02_quickstart_csv.py --output ./output
          python examples/03_from_plant_objective.py --output ./output
          python examples/04_relay_autotune.py --output ./output
          python examples/05_compare_rules.py --output ./output
          python examples/06_diagnosing_bad_data.py --output ./output
